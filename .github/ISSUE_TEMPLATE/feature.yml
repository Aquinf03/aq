name: Feature request
description: Propose a focused improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Open an issue before a large PR. Describe the problem first, then the approach.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today? Who hits this?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: How you think aq / aquin should change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other options you thought about (optional).
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not change the train directory contract (recipe.yaml + artifacts/) without discussion
          required: false
        - label: I am willing to help implement or add a scripts/tests/ train if this is accepted
          required: false
