name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript + CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aq
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: aq/package-lock.json

      - name: Install
        run: npm ci

      - name: Compile
        run: npm run build

      - name: Dist entry exists
        run: test -f dist/cli.js && test -f bin/aq

      - name: Package (npm pack)
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          tar tzf "$RUNNER_TEMP"/aq-*.tgz | head -40
          tar tzf "$RUNNER_TEMP"/aq-*.tgz | grep -E '^(package/bin/aq|package/dist/cli.js)$'

      - name: CLI smoke
        run: |
          node bin/aq help
          node bin/aq version
          node bin/aq doctor || true

  python:
    name: Python + basic SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Venv + install SDK (editable)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ./aq
          # tabular smoke deps only — not full kernel/requirements.txt (torch, etc.)
          .venv/bin/pip install "scikit-learn>=1.4.0" "joblib>=1.3.0"

      - name: Import aquin
        run: |
          .venv/bin/python -c "import aquin; from aquin import Aquin; print('aquin', aquin.__version__)"

      - name: Syntax (compileall)
        run: |
          .venv/bin/python -m compileall -q aq/aquin aq/kernel

      - name: Basic SDK train (sdk-ridge)
        run: |
          cd scripts/tests/sdk-ridge
          ../../../.venv/bin/python example.py
