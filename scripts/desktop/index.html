<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Aquin</title>
    <!-- Same families as former next/font (variables set on #root body class) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cardo:wght@400;700&family=Host+Grotesk:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      window.process = window.process || { env: {} };
      (function () {
        try {
          var t = localStorage.getItem("aquin-theme");
          if (t !== "dark" && t !== "light") t = "light";
          var r = document.documentElement;
          r.classList.toggle("dark", t === "dark");
          r.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body
    class="min-h-screen bg-background text-foreground overflow-x-hidden antialiased w-full mx-auto scroll-smooth font-host-grotesk"
    style="--font-roboto: 'Roboto', ui-sans-serif, system-ui, sans-serif; --font-cardo: 'Cardo', ui-serif, Georgia, serif; --font-host-grotesk: 'Host Grotesk', ui-sans-serif, system-ui, sans-serif;"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
