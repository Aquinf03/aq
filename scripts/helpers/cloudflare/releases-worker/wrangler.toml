name = "aqfw-releases"
main = "src/index.ts"
compatibility_date = "2024-08-01"
workers_dev = true

[[r2_buckets]]
binding = "RELEASES"
bucket_name = "releases"

# axi only — aq installs from GitHub Releases (Aquinf03/aq).
[[routes]]
pattern = "releases.aquin.app/releases/*"
zone_name = "aquin.app"

[[routes]]
pattern = "releases.aquin.app/axi/download/install.sh"
zone_name = "aquin.app"
